name: Package Aseprite extension

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: macos-arm64
            runner: macos-15
          - platform: macos-x64
            runner: macos-15-intel

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build CLI
        run: cargo build --release --locked -p aseprite-psd

      - name: Package extension (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\tools\package-aseprite-extension.ps1 -Platform ${{ matrix.platform }} -Binary .\target\release\aseprite-psd.exe -NoBuild

      - name: Package extension (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: bash tools/package-aseprite-extension.sh --platform "${{ matrix.platform }}" --binary target/release/aseprite-psd --no-build

      - name: Verify converter (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\target\release\aseprite-psd.exe --help

      - name: Verify converter (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: ./target/release/aseprite-psd --help

      - name: Upload extension package
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-psd-${{ matrix.platform }}
          path: dist/aseprite-psd-${{ matrix.platform }}.aseprite-extension
          if-no-files-found: error

      - name: Upload converter binary
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-psd-converter-${{ matrix.platform }}
          path: target/release/aseprite-psd*
          if-no-files-found: error

  universal:
    name: Package (universal)
    needs: package
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Download Windows converter
        uses: actions/download-artifact@v4
        with:
          name: aseprite-psd-converter-windows-x64
          path: universal-input/windows-x64

      - name: Download Linux converter
        uses: actions/download-artifact@v4
        with:
          name: aseprite-psd-converter-linux-x64
          path: universal-input/linux-x64

      - name: Download macOS arm64 converter
        uses: actions/download-artifact@v4
        with:
          name: aseprite-psd-converter-macos-arm64
          path: universal-input/macos-arm64

      - name: Download macOS x64 converter
        uses: actions/download-artifact@v4
        with:
          name: aseprite-psd-converter-macos-x64
          path: universal-input/macos-x64

      - name: Prepare Unix executable permissions
        shell: bash
        run: chmod +x universal-input/linux-x64/aseprite-psd universal-input/macos-arm64/aseprite-psd universal-input/macos-x64/aseprite-psd

      - name: Verify downloaded converters
        shell: bash
        run: |
          test -f universal-input/windows-x64/aseprite-psd.exe
          test -x universal-input/linux-x64/aseprite-psd
          test -x universal-input/macos-arm64/aseprite-psd
          test -x universal-input/macos-x64/aseprite-psd

      - name: Package universal extension
        shell: bash
        run: bash tools/package-aseprite-extension.sh --platform universal --binary-dir universal-input --no-build

      - name: Upload universal extension package
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-psd-universal
          path: dist/aseprite-psd-universal.aseprite-extension
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: universal
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download Windows x64 package
        uses: actions/download-artifact@v4
        with:
          name: aseprite-psd-windows-x64
          path: release-assets

      - name: Download Linux x64 package
        uses: actions/download-artifact@v4
        with:
          name: aseprite-psd-linux-x64
          path: release-assets

      - name: Download macOS arm64 package
        uses: actions/download-artifact@v4
        with:
          name: aseprite-psd-macos-arm64
          path: release-assets

      - name: Download macOS x64 package
        uses: actions/download-artifact@v4
        with:
          name: aseprite-psd-macos-x64
          path: release-assets

      - name: Download universal package
        uses: actions/download-artifact@v4
        with:
          name: aseprite-psd-universal
          path: release-assets

      - name: Verify release assets
        shell: bash
        run: |
          expected=(
            aseprite-psd-windows-x64.aseprite-extension
            aseprite-psd-linux-x64.aseprite-extension
            aseprite-psd-macos-arm64.aseprite-extension
            aseprite-psd-macos-x64.aseprite-extension
            aseprite-psd-universal.aseprite-extension
          )
          for asset in "${expected[@]}"; do
            test -f "release-assets/$asset"
          done

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --generate-notes --title "$tag"
          fi
          gh release upload "$tag" release-assets/*.aseprite-extension --clobber
