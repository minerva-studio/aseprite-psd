[workspace]
members = [
    "crates/aseprite-psd-core",
    "crates/aseprite-psd-cli",
    "tools/rust-aseprite-psd-probe",
]
default-members = [
    "crates/aseprite-psd-core",
    "crates/aseprite-psd-cli",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
ag-psd = { git = "https://github.com/minerva-studio/ag-psd-rs.git", rev = "e1f3db7" }
aseprite-io = "0.2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
