[workspace]
members = [
    "crates/aseprite-psd-core",
    "crates/aseprite-psd-cli",
    "tools/rust-aseprite-psd-probe",
]
default-members = [
    "crates/aseprite-psd-core",
    "crates/aseprite-psd-cli",
]
resolver = "2"

[workspace.package]
version = "0.3.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
# Temporary local override while the Frame Animation writer work is validated.
# Restore this to the pinned git revision after ag-psd-rs is committed.
ag-psd = { path = "../ag-psd-rs" }
aseprite-io = "0.2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
